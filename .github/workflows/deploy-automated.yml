name: Automated Contract Deployment

on:
    push:
        branches: [main, develop]
        tags: ['v*']
    workflow_dispatch:
        inputs:
            network:
                description: 'Target network'
                required: true
                default: 'testnet'
                type: choice
                options:
                    - testnet
                    - mainnet
            verify:
                description: 'Run verification after deploy'
                required: true
                default: true
                type: boolean
            run_health_check:
                description: 'Run health checks after deploy'
                required: true
                default: true
                type: boolean
            notify:
                description: 'Send deployment notification'
                required: true
                default: true
                type: boolean

env:
    NODE_VERSION: '20'
    RUST_TOOLCHAIN: '1.94.1'
    SOROBAN_CLI_VERSION: '26.1.0'

jobs:
    determine-network:
        name: Determine Network
        runs-on: ubuntu-latest
        outputs:
            network: ${{ steps.network.outputs.network }}
            is_mainnet: ${{ steps.network.outputs.is_mainnet }}
        steps:
            - id: network
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      echo "network=${{ github.event.inputs.network }}" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                      echo "network=mainnet" >> "$GITHUB_OUTPUT"
                  else
                      echo "network=testnet" >> "$GITHUB_OUTPUT"
                  fi
                  if [[ "${{ steps.network.outputs.network }}" == "mainnet" ]]; then
                      echo "is_mainnet=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "is_mainnet=false" >> "$GITHUB_OUTPUT"
                  fi

    deploy-contracts:
        name: Build & Deploy Contracts
        runs-on: ubuntu-latest
        needs: [determine-network]
        environment: ${{ needs.determine-network.outputs.is_mainnet == 'true' && 'mainnet' || 'testnet' }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  targets: wasm32-unknown-unknown

            - name: Cache Cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      contracts/target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

            - name: Install System Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev binaryen jq

            - name: Install Stellar CLI
              run: cargo install --locked --version ${{ env.SOROBAN_CLI_VERSION }} stellar-cli

            - name: Deploy Contracts
              env:
                  STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
                  NETWORK: ${{ needs.determine-network.outputs.network }}
              run: |
                  chmod +x scripts/deploy-contracts.sh
                  ./scripts/deploy-contracts.sh "$NETWORK" "${{ github.sha }}" "true"

            - name: Run Verification
              if: ${{ github.event.inputs.verify != 'false' }}
              env:
                  NETWORK: ${{ needs.determine-network.outputs.network }}
              run: |
                  chmod +x scripts/verify-contracts.sh
                  ./scripts/verify-contracts.sh "$NETWORK" "${{ github.sha }}"

            - name: Run Health Checks
              if: ${{ github.event.inputs.run_health_check != 'false' }}
              env:
                  NETWORK: ${{ needs.determine-network.outputs.network }}
                  RPC_URL: ${{ needs.determine-network.outputs.is_mainnet == 'true' && 'https://soroban-rpc.stellar.org:443' || 'https://soroban-testnet.stellar.org:443' }}
                  NETWORK_PASSPHRASE: ${{ needs.determine-network.outputs.is_mainnet == 'true' && 'Public Global Stellar Network ; September 2015' || 'Test SDF Network ; September 2015' }}
              run: |
                  chmod +x scripts/health-check.sh
                  ./scripts/health-check.sh "$NETWORK" "${{ github.sha }}"

            - name: Upload Deployment Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: deployment-artifacts-${{ needs.determine-network.outputs.network }}
                  path: .deployments/${{ needs.determine-network.outputs.network }}/${{ github.sha }}/
                  retention-days: 30

            - name: Upload Contract WASM
              uses: actions/upload-artifact@v4
              with:
                  name: contracts-wasm-${{ needs.determine-network.outputs.network }}
                  path: contracts/target/wasm32-unknown-unknown/release/*.wasm
                  retention-days: 30

    notify:
        name: Deployment Notification
        if: ${{ github.event.inputs.notify != 'false' }}
        runs-on: ubuntu-latest
        needs: [deploy-contracts, determine-network]
        steps:
            - name: Check deployment status
              run: |
                  echo "Deployment to ${{ needs.determine-network.outputs.network }} completed with status: ${{ job.status }}"

            - name: Slack Notification
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
                  SLACK_CHANNEL: '#deployments'
                  SLACK_TITLE: 'Contract Deployment to ${{ needs.determine-network.outputs.network }}'
                  SLACK_MESSAGE: |
                      Deployment of Traqora contracts completed.
                      Network: ${{ needs.determine-network.outputs.network }}
                      Commit: ${{ github.sha }}
                      Status: ${{ job.status }}
                  SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
                  SLACK_FOOTER: 'Traqora CI/CD'
              continue-on-error: true

    migration-check:
        name: Migration Compatibility Check
        runs-on: ubuntu-latest
        needs: [determine-network]
        if: ${{ needs.determine-network.outputs.is_mainnet == 'true' }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check for breaking changes
              run: |
                  echo "## Migration Compatibility Check" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"

                  CHANGED_CONTRACTS=$(git diff --name-only HEAD~1 -- contracts/packages/ || echo "")
                  if [ -z "$CHANGED_CONTRACTS" ]; then
                      echo "No contract changes detected." >> "$GITHUB_STEP_SUMMARY"
                      echo "status=no_changes" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "Changed contracts:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "$CHANGED_CONTRACTS" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "status=changes_detected" >> "$GITHUB_OUTPUT"
