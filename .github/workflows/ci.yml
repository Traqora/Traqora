name: CI

# Triggers
on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".vscode/**"
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".vscode/**"

# Cancel superseded runs on the same ref to free runner capacity immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "1.94.1"
  SOROBAN_CLI_VERSION: "26.1.0"
  # Shared Cargo cache paths — referenced in every Rust job.
  CARGO_CACHE_PATHS: |
    ~/.cargo/bin/
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    contracts/target/

# ---------------------------------------------------------------------------
# Reusable step fragments expressed as composite-action-style env vars are not
# supported in plain YAML, so shared logic is repeated but kept DRY via the
# env block above and the restore-keys pattern documented below.
#
# Cache strategy
# ──────────────
#  npm    : primary key  = OS + lock-file hash
#           restore-keys = OS prefix (partial hit on lock-file change)
#  cargo  : primary key  = OS + Cargo.lock hash
#           restore-keys = OS prefix (partial hit on Cargo.lock change)
#  llvm-cov: keyed on the tool version so upgrades bust the cache correctly
#  apt    : keyed on a weekly date bucket to avoid stale package lists
# ---------------------------------------------------------------------------

jobs:
  # ── Change detection ──────────────────────────────────────────────────────
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - 'package.json'
              - 'package-lock.json'
            client:
              - 'packages/client/**'
              - 'package.json'
              - 'package-lock.json'
            contracts:
              - 'contracts/**'

  # ── Quality: Backend ──────────────────────────────────────────────────────
  quality-backend:
    name: Quality - Backend
    needs: [detect]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - run: npm run typecheck --workspace=packages/backend

      - run: npm run lint --workspace=packages/backend

  # ── Quality: Client ───────────────────────────────────────────────────────
  quality-client:
    name: Quality - Client
    needs: [detect]
    if: needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - run: npm run typecheck --workspace=packages/client

      - run: npm run lint --workspace=packages/client

  # ── Quality: Contracts ────────────────────────────────────────────────────
  quality-contracts:
    name: Quality - Contracts
    needs: [detect]
    if: needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-contracts
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libudev-dev

      - name: Format check
        working-directory: contracts
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: contracts
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

  # ── Tests: Backend ────────────────────────────────────────────────────────
  test-backend:
    name: Tests - Backend
    needs: [detect, quality-backend]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - run: npm test --workspace=packages/backend -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: packages/backend/coverage
          flags: backend
          fail_ci_if_error: false

  # ── Tests: Client ─────────────────────────────────────────────────────────
  test-client:
    name: Tests - Client
    needs: [detect, quality-client]
    if: needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - run: npm test --workspace=packages/client -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: packages/client/coverage
          flags: client
          fail_ci_if_error: false

  # ── Tests: Contracts ──────────────────────────────────────────────────────
  test-contracts:
    name: Tests - Contracts
    needs: [detect, quality-contracts]
    if: needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # cargo-llvm-cov is a large binary; cache it keyed on version so an
      # upgrade busts the cache but patch-identical runs skip the download.
      - name: Restore cargo-llvm-cov binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-contracts
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libudev-dev

      - name: Run tests
        working-directory: contracts
        run: cargo test --locked

      - name: Install cargo-llvm-cov (if not cached)
        run: cargo install cargo-llvm-cov --locked 2>/dev/null || true

      - name: Coverage
        working-directory: contracts
        run: cargo llvm-cov --summary-only --fail-under-lines 90

  # ── Integration: Backend ──────────────────────────────────────────────────
  integration-backend:
    name: Integration - Backend
    needs: [detect, test-backend]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: traqora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - name: Run integration tests
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://postgres:password@localhost:5432/traqora_test
          JWT_SECRET: test-secret
          STELLAR_NETWORK: testnet
        run: npm run test:integration --workspace=packages/backend

  # ── Smoke: Backend ────────────────────────────────────────────────────────
  smoke-backend:
    name: Smoke - Auth / Search / Book
    needs: [detect, test-backend]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run E2E smoke tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          STELLAR_NETWORK: testnet
          BOOKING_CONTRACT_ID: CTESTBOOKING
          AIRLINE_CONTRACT_ID: CTESTAIRLINE
          REFUND_CONTRACT_ID: CTESTREFUND
          LOYALTY_CONTRACT_ID: CTESTLOYALTY
          GOVERNANCE_CONTRACT_ID: CTESTGOV
          TOKEN_CONTRACT_ID: CTESTTOKEN
          FLIGHT_REGISTRY_CONTRACT_ID: CTESTREG
          ENCRYPTION_KEY: test-encryption-key-for-traqora-database-encryption-!!!
        run: >
          npm test --workspace=packages/backend --
          --testPathPattern="e2e-smoke"
          --runInBand
          --forceExit
          --json
          --outputFile=packages/backend/smoke-report.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.sha }}
          path: packages/backend/smoke-report.json
          retention-days: 30

  # ── Security (all run in parallel, independent of each other) ────────────
  # security-snyk and security-gitleaks start as soon as detect finishes —
  # they don't need test or integration results, so they no longer block on
  # those jobs and run concurrently with the test tier.
  security-snyk:
    name: Security - Snyk
    needs: [detect]
    if: needs.detect.outputs.backend == 'true' || needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
        continue-on-error: true

  security-gitleaks:
    name: Security - Gitleaks
    needs: [detect]
    if: needs.detect.outputs.backend == 'true' || needs.detect.outputs.client == 'true' || needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-dependency-review:
    name: Security - Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

  # ── Build (backend + client run in parallel) ──────────────────────────────
  build-backend:
    name: Build - Backend
    needs: [detect, test-backend]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - run: npm run build --workspace=packages/backend

  build-client:
    name: Build - Client
    needs: [detect, test-client]
    if: needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - run: npm install --legacy-peer-deps

      - run: npm run build --workspace=packages/client

  build-contracts:
    name: Build - Contracts
    needs: [detect, test-contracts]
    if: needs.detect.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-contracts
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libudev-dev

      - name: Install Soroban CLI
        run: cargo install --locked --version ${{ env.SOROBAN_CLI_VERSION }} soroban-cli

      - name: Build release WASM
        working-directory: contracts
        run: cargo build --locked --target wasm32-unknown-unknown --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ── Docker security (matrix — backend + client in parallel) ───────────────
  # Docker layer cache is stored in the GitHub Actions cache backend (GHA)
  # so subsequent builds only transfer changed layers.
  docker-security:
    name: Docker Security Scan
    needs: [detect]
    if: needs.detect.outputs.backend == 'true' || needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: packages/backend
          - name: client
            context: packages/client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          target: production
          push: false
          load: true
          tags: traqora-${{ matrix.service.name }}:${{ github.sha }}
          # GHA cache: warm pulls on unchanged layers, full rebuild only on changes
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.27.0
        with:
          image-ref: traqora-${{ matrix.service.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@0.27.0
        with:
          image-ref: traqora-${{ matrix.service.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          exit-code: "0"
          ignore-unfixed: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.service.name }}-sarif
          path: trivy-${{ matrix.service.name }}.sarif
          retention-days: 14

  # ── Final gate ────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    if: always()
    needs:
      - build-backend
      - build-client
      - build-contracts
      - integration-backend
      - smoke-backend
      - security-snyk
      - security-gitleaks
      - security-dependency-review
      - docker-security
    runs-on: ubuntu-latest
    steps:
      - name: Fail on critical failure
        if: |
          always() && (
            needs.build-backend.result == 'failure' ||
            needs.build-client.result == 'failure' ||
            needs.build-contracts.result == 'failure' ||
            needs.integration-backend.result == 'failure' ||
            needs.smoke-backend.result == 'failure'
          )
        run: exit 1

