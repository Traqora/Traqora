name: Infra Deploy

# Issue #587: PRs that touch terraform/ get fmt-check + validate + a real
# init+plan (against the "dev" workspace) so config errors surface before
# merge, without ever applying. `push`/`workflow_dispatch` keep the existing
# deploy-to-staging/prod behaviour. See terraform/README.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra-deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to deploy"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: infra-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.5.9"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # STAGE 1: Application Validation
  # ============================================================================

  validate-app:
    name: Validate Application Code
    runs-on: ubuntu-latest
    # Skipped on PRs: ci.yml already covers app quality on every PR. This
    # gate only needs to run before an actual `terraform apply` (push to
    # main / workflow_dispatch).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Backend Typecheck
        run: npm run typecheck --workspace=packages/backend

      - name: Backend Lint
        run: npm run lint --workspace=packages/backend

      - name: Backend Tests
        run: npm test --workspace=packages/backend

      - name: Client Build
        run: npm run build --workspace=packages/client

  # ============================================================================
  # STAGE 2: Terraform Validation
  # ============================================================================

  validate-terraform:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    # Intentionally not gated on validate-app: this must run for every PR
    # touching terraform/, including ones that don't touch app code.
    outputs:
      tf-workspace: ${{ steps.env.outputs.tf-workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init (local, no backend)
        # Format/validate never need the real backend or cloud credentials,
        # so every contributor (including forks) gets this signal for free.
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Security Scan
        working-directory: terraform
        run: |
          # Install tfsec if not available
          if ! command -v tfsec &> /dev/null; then
            curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          fi
          tfsec --format json --out tfsec-results.json || true

      - name: Upload tfsec Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-results
          path: terraform/tfsec-results.json
          retention-days: 7

      - name: Determine Target Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tf-workspace=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PRs only ever plan against the ephemeral/dev workspace, never
            # staging or prod (issue #587).
            echo "tf-workspace=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tf-workspace=prod" >> $GITHUB_OUTPUT
          else
            echo "tf-workspace=staging" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # STAGE 3: Terraform Plan
  # ============================================================================

  plan-terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate-terraform
    environment: ${{ needs.validate-terraform.outputs.tf-workspace }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required to assume AWS_ROLE_TO_ASSUME via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check remote backend is configured
        id: backend
        run: |
          if [ -n "${{ secrets.TF_STATE_BUCKET }}" ] && [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TF_STATE_BUCKET/AWS_ROLE_TO_ASSUME secrets are not set (expected on fork PRs). Skipping the real init+plan; fmt+validate above still ran."
          fi

      - name: Configure AWS Credentials
        if: steps.backend.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      # Real backend (issue #587): state lives in S3, keyed per workspace, so
      # a `dev` PR plan can never see or clobber staging/prod state.
      - name: Terraform Init (real backend)
        if: steps.backend.outputs.configured == 'true'
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=traqora/${{ needs.validate-terraform.outputs.tf-workspace }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Select Workspace
        if: steps.backend.outputs.configured == 'true'
        working-directory: terraform
        run: |
          terraform workspace select ${{ needs.validate-terraform.outputs.tf-workspace }} || \
          terraform workspace new ${{ needs.validate-terraform.outputs.tf-workspace }}

      - name: Terraform Plan
        if: steps.backend.outputs.configured == 'true'
        working-directory: terraform
        run: terraform plan -input=false -var-file=./environments/${{ needs.validate-terraform.outputs.tf-workspace }}.tfvars -out=tfplan

      - name: Terraform Plan (human-readable)
        if: steps.backend.outputs.configured == 'true'
        working-directory: terraform
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Save Plan
        if: steps.backend.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.validate-terraform.outputs.tf-workspace }}
          path: terraform/tfplan
          retention-days: 7

      - name: Comment Plan on PR
        if: steps.backend.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/tfplan.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (\`${{ needs.validate-terraform.outputs.tf-workspace }}\`)\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

  # ============================================================================
  # STAGE 4: Terraform Apply (requires approval for prod)
  # ============================================================================

  apply-terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [validate-terraform, plan-terraform]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.validate-terraform.outputs.tf-workspace }}
    permissions:
      contents: read
      id-token: write # required to assume AWS_ROLE_TO_ASSUME via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.validate-terraform.outputs.tf-workspace }}
          path: terraform/

      - name: Terraform Init (real backend)
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=traqora/${{ needs.validate-terraform.outputs.tf-workspace }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Select Workspace
        working-directory: terraform
        run: |
          terraform workspace select ${{ needs.validate-terraform.outputs.tf-workspace }} || \
          terraform workspace new ${{ needs.validate-terraform.outputs.tf-workspace }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

      - name: Extract Outputs
        id: outputs
        working-directory: terraform
        run: |
          terraform output -json > outputs.json
          echo "outputs-extracted=true" >> $GITHUB_OUTPUT

      - name: Upload Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.validate-terraform.outputs.tf-workspace }}
          path: terraform/outputs.json
          retention-days: 30

  # ============================================================================
  # STAGE 5: Post-Deployment Verification
  # ============================================================================

  verify-deployment:
    name: Verify Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: [validate-terraform, apply-terraform]
    # apply-terraform is skipped entirely on pull_request (plan-only), so
    # only run this when something was actually applied.
    if: needs.apply-terraform.result == 'success'
    environment: ${{ needs.validate-terraform.outputs.tf-workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs-${{ needs.validate-terraform.outputs.tf-workspace }}
          path: terraform/

      - name: Run Infrastructure Tests
        run: |
          echo "Running infrastructure verification tests..."
          # Add infrastructure-specific tests here:
          # - DNS resolution checks
          # - Load balancer health checks
          # - Database connectivity tests
          # - Security group validation
          echo "Infrastructure verification passed"

  # ============================================================================
  # STAGE 6: Notification
  # ============================================================================

  notify:
    name: Notification
    needs: [validate-terraform, plan-terraform, apply-terraform, verify-deployment]
    # apply-terraform/verify-deployment are intentionally skipped on
    # pull_request (plan-only) — this job only judges deploy success/failure
    # when a deploy was actually attempted (push to main / workflow_dispatch).
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Status
        run: |
          if [ "${{ needs.apply-terraform.result }}" == "success" ] && \
             [ "${{ needs.verify-deployment.result }}" == "success" ]; then
            echo "✅ Infrastructure deployment successful!"
            # Add Slack/Discord notification here if needed
          else
            echo "❌ Infrastructure deployment failed."
            echo "Validation: ${{ needs.validate-terraform.result }}"
            echo "Plan: ${{ needs.plan-terraform.result }}"
            echo "Apply: ${{ needs.apply-terraform.result }}"
            echo "Verification: ${{ needs.verify-deployment.result }}"
            # Add failure notification here
            exit 1
          fi
