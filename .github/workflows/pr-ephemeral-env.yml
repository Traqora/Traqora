name: PR Ephemeral Environment

# Issue #588: spin up a disposable backend + db from terraform/ for each PR
# that touches backend or terraform code, run the integration suite against
# it, and always tear it down again.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/backend/**"
      - "terraform/environments/ephemeral/**"
      - ".github/workflows/pr-ephemeral-env.yml"

concurrency:
  group: pr-ephemeral-env-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.5.9"
  NODE_VERSION: "20"

jobs:
  ephemeral-env:
    name: Provision, Test, Destroy
    runs-on: ubuntu-latest
    # Lifetime cap (issue #588 acceptance criteria): this environment is
    # never allowed to outlive one CI run.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --target production \
            -t traqora-backend:pr-${{ github.event.pull_request.number }} \
            packages/backend

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/ephemeral
        run: terraform init -input=false

      - name: Terraform Apply (provision ephemeral env)
        id: apply
        working-directory: terraform/environments/ephemeral
        run: |
          terraform apply -input=false -auto-approve \
            -var="pr_number=${{ github.event.pull_request.number }}" \
            -var="backend_image=traqora-backend:pr-${{ github.event.pull_request.number }}"
          echo "backend_url=$(terraform output -raw backend_url)" >> "$GITHUB_OUTPUT"

      - name: Wait for backend health
        run: |
          url="${{ steps.apply.outputs.backend_url }}"
          echo "Waiting on $url/health ..."
          for i in $(seq 1 30); do
            if curl -sf "$url/health" >/dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ephemeral backend never became healthy at $url"
          docker logs "traqora-pr-${{ github.event.pull_request.number }}-backend" || true
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run integration suite against the ephemeral environment
        env:
          API_BASE_URL: ${{ steps.apply.outputs.backend_url }}
        run: npm run test:integration --workspace=packages/backend

      - name: Comment environment status on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}' === 'success' ? '✅ passed' : '❌ failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Ephemeral PR environment integration run: ${outcome}. Environment is destroyed regardless of outcome.`
            });

      # This is the lifetime cap for issue #588: the environment is destroyed
      # here regardless of test outcome, and even if this step never runs
      # (crash, cancellation), the GitHub-hosted runner VM itself — and every
      # Docker container on it — is torn down the moment the job ends, so no
      # ephemeral resource can outlive this single job. See terraform/README.md.
      - name: Terraform Destroy (always tear down)
        if: always()
        working-directory: terraform/environments/ephemeral
        run: |
          terraform destroy -input=false -auto-approve \
            -var="pr_number=${{ github.event.pull_request.number }}" \
            -var="backend_image=traqora-backend:pr-${{ github.event.pull_request.number }}"
