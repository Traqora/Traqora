name: CD - Testnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.94.1"
  SOROBAN_CLI_VERSION: "26.1.0"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # STAGE 1: Build Contracts
  # ============================================================================

  build-contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    outputs:
      contracts-built: ${{ steps.build.outputs.contracts-built }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev

      - name: Install Soroban CLI
        run: cargo install --locked --version ${{ env.SOROBAN_CLI_VERSION }} soroban-cli

      - name: Build Contracts
        id: build
        run: |
          cd contracts
          cargo build --locked --target wasm32-unknown-unknown --release
          echo "contracts-built=true" >> $GITHUB_OUTPUT

      - name: Compute WASM checksums
        run: |
          chmod +x scripts/compute-wasm-hashes.sh
          ./scripts/compute-wasm-hashes.sh contracts/target/wasm32-unknown-unknown/release .artifacts/wasm-checksums

      - name: Upload Contract Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traqora-contracts-wasm
          path: |
            contracts/target/wasm32-unknown-unknown/release/*.wasm
            .artifacts/wasm-checksums/*
          retention-days: 7

  # ============================================================================
  # STAGE 1b: Verify Contract Build Checksums (issue #592)
  # Rebuilds from source and fails if the recorded hashes do not match,
  # guarding against non-reproducible builds / deployment-target drift.
  # ============================================================================

  verify-build-checksums:
    name: Verify Contract Build Checksums
    runs-on: ubuntu-latest
    needs: build-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev jq

      - name: Build Contracts
        working-directory: contracts
        run: cargo build --locked --target wasm32-unknown-unknown --release

      - name: Download Contract Artifacts
        uses: actions/download-artifact@v4
        with:
          name: traqora-contracts-wasm
          path: .artifacts

      - name: Verify build checksums
        run: |
          FAILED=0
          while read -r expected name; do
            [ -n "$expected" ] || continue
            actual=$(sha256sum ".artifacts/$name" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "  ✗ $name: uploaded WASM hash $actual != recorded $expected"
              FAILED=1
            fi
          done < .artifacts/wasm-checksums.sha256

          for wasm in contracts/target/wasm32-unknown-unknown/release/*.wasm; do
            [ -e "$wasm" ] || continue
            name=$(basename "$wasm")
            local_hash=$(sha256sum "$wasm" | cut -d' ' -f1)
            recorded_hash=$(jq -r ".\"$name\" // empty" .artifacts/wasm-hashes.json)
            if [ -z "$recorded_hash" ] || [ "$local_hash" != "$recorded_hash" ]; then
              echo "  ✗ $name: local build does not match recorded checksum"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "=== Contract build checksum verification FAILED ==="
            exit 1
          fi
          echo "=== Contract build checksum verification PASSED ==="

  # ============================================================================
  # STAGE 2: Deploy Contracts to Testnet
  # ============================================================================

  deploy-contracts:
    name: Deploy Contracts to Testnet
    runs-on: ubuntu-latest
    needs: [build-contracts, verify-build-checksums]
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Download Contract Artifacts
        uses: actions/download-artifact@v4
        with:
          name: traqora-contracts-wasm
          path: contracts/target/wasm32-unknown-unknown/release/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Install Soroban CLI
        run: cargo install --locked --version ${{ env.SOROBAN_CLI_VERSION }} soroban-cli

      - name: Deploy to Testnet
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_SECRET_KEY }}
          NETWORK: testnet
          RPC_URL: https://soroban-testnet.stellar.org:443
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: |
          soroban network add --rpc-url $RPC_URL --network-passphrase "$NETWORK_PASSPHRASE" $NETWORK
          echo "$SOROBAN_SECRET_KEY" > secret.txt
          soroban config identity add --secret-key deployer < secret.txt
          rm secret.txt

          # Deploy booking contract
          CONTRACT_ID=$(soroban contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/booking.wasm \
            --source deployer \
            --network $NETWORK)

          echo "Deployed Contract ID: $CONTRACT_ID"
          echo "CONTRACT_ID=$CONTRACT_ID" >> $GITHUB_ENV

      - name: Output Contract IDs
        run: |
          echo "Contract deployed to testnet: ${{ env.CONTRACT_ID }}"

  # ============================================================================
  # STAGE 3: Build and Deploy Application
  # ============================================================================

  deploy-app:
    name: Build and Deploy App to Testnet
    runs-on: ubuntu-latest
    needs: deploy-contracts
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Backend
        run: npm run build --workspace=packages/backend

      - name: Build Client
        run: npm run build --workspace=packages/client

      - name: Deploy to Testnet
        run: |
          echo "Deploying application components to testnet..."
          # Add actual deployment commands here
          # This could involve:
          # - Building Docker images
          # - Pushing to registry
          # - Updating Kubernetes manifests
          # - Running database migrations
          echo "Deployment to testnet completed successfully"

  # ============================================================================
  # STAGE 3b: Canary deployment & promotion (issue #591)
  #
  # Testnet is the ephemeral/dev environment, so the whole canary flow is
  # automatic: one instance is deployed, health + smoke checks must pass, and
  # only then is the release promoted to the full fleet. If the canary is not
  # healthy the canary instance is rolled back and the run fails before any
  # wider rollout happens.
  # ============================================================================

  deploy-canary:
    name: Deploy Canary Instance (Testnet)
    runs-on: ubuntu-latest
    needs: [deploy-contracts, deploy-app]
    environment: testnet
    outputs:
      canary-url: ${{ steps.canary.outputs.canary-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy single canary instance
        id: canary
        env:
          CANARY_URL: ${{ secrets.CANARY_URL || 'http://localhost:3001' }}
        run: |
          echo "Deploying a single canary instance to testnet..."
          # Replace with the real single-instance rollout primitive, e.g.:
          #   kubectl scale deployment/traqora-backend --replicas=1
          #   kubectl set image deployment/traqora-backend backend=<image>:${{ github.sha }}
          # or a canary profile in docker-compose.prod.yml:
          #   docker compose -f docker-compose.prod.yml --profile canary up -d --wait
          echo "canary-url=$CANARY_URL" >> "$GITHUB_OUTPUT"
          echo "Canary instance deployed at $CANARY_URL"

  verify-canary:
    name: Verify Canary (Health + Smoke)
    runs-on: ubuntu-latest
    needs: [deploy-contracts, deploy-app, deploy-canary]
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Wait for canary readiness
        env:
          CANARY_URL: ${{ needs.deploy-canary.outputs.canary-url }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "$CANARY_URL/health" > /dev/null 2>&1; then
              echo "Canary is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for canary to become ready ($i/30)..."
            sleep 10
          done
          echo "Canary did not become ready in time"
          exit 1

      - name: Health and smoke checks against canary
        env:
          CANARY_URL: ${{ needs.deploy-canary.outputs.canary-url }}
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh testnet latest --api-url "$CANARY_URL" --skip-contracts

      - name: Contract health checks
        env:
          NETWORK: testnet
          RPC_URL: https://soroban-testnet.stellar.org:443
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: |
          # Contract-level checks run only when deployment artifacts exist.
          if [ -d .deployments/testnet ]; then
            chmod +x scripts/health-check.sh
            ./scripts/health-check.sh "$NETWORK" latest
          else
            echo "No .deployments artifacts on this runner - skipping on-chain contract checks"
          fi

  promote-canary:
    name: Promote Canary to Full Rollout (Testnet)
    runs-on: ubuntu-latest
    needs: [deploy-contracts, deploy-app, deploy-canary, verify-canary]
    if: needs.verify-canary.result == 'success'
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Roll out to remaining instances
        run: |
          echo "Canary healthy - rolling out to the full testnet fleet."
          # Replace with the real full rollout, e.g.:
          #   kubectl rollout status deployment/traqora-backend -n testnet
          #   kubectl rollout status deployment/traqora-client -n testnet
          # or scale the canary profile up to all instances:
          #   docker compose -f docker-compose.prod.yml --profile full up -d --wait
          echo "Full testnet rollout completed"

      - name: Post-promotion health check
        env:
          API_URL: ${{ secrets.API_URL || 'http://localhost:3001' }}
        run: |
          for i in $(seq 1 10); do
            if curl -sf --max-time 5 "$API_URL/health" > /dev/null 2>&1; then
              echo "Post-promotion health check passed (attempt $i)"
              exit 0
            fi
            echo "Waiting for full rollout to become healthy ($i/10)..."
            sleep 10
          done
          echo "Post-promotion health check failed"
          exit 1

  abort-canary:
    name: Abort Canary (Testnet)
    runs-on: ubuntu-latest
    needs: [deploy-contracts, deploy-app, deploy-canary, verify-canary]
    if: failure() && needs.verify-canary.result == 'failure'
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Roll back canary instance
        run: |
          echo "Canary verification failed - rolling back the canary instance. Full rollout skipped."
          # Replace with the real rollback primitive, e.g.:
          #   kubectl rollout undo deployment/traqora-backend -n testnet
          # or docker compose -f docker-compose.prod.yml --profile canary down
          echo "Canary instance rolled back."

      - name: Notify canary abort
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\":boom: Testnet canary verification failed - rollout aborted. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
          fi

  # ============================================================================
  # STAGE 4: Automated Rollback (only runs if app deploy failed after contracts succeeded)
  # ============================================================================

  rollback:
    name: Rollback Testnet Deployment
    needs: [deploy-contracts, deploy-app]
    if: failure() && needs.deploy-app.result == 'failure'
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Roll back to previous release
        run: |
          echo "Deployment failed - rolling back to last known-good release for testnet."
          # Add actual rollback commands here, e.g.:
          # - kubectl rollout undo deployment/traqora-backend -n testnet
          # - kubectl rollout undo deployment/traqora-client -n testnet
          echo "Rollback completed."

      - name: Notify rollback
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\":rewind: Testnet deployment failed and was rolled back. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
          fi

  # ============================================================================
  # STAGE 5: Notification
  # ============================================================================

  notify:
    name: Notification
    needs: [deploy-contracts, deploy-app, deploy-canary, verify-canary, promote-canary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Status
        id: status
        run: |
          if [ "${{ needs.deploy-contracts.result }}" == "success" ] && [ "${{ needs.deploy-app.result }}" == "success" ] && [ "${{ needs.promote-canary.result }}" == "success" ]; then
            echo "✅ Deployment to Testnet successful!"
            echo "message=✅ Traqora testnet deployment succeeded - canary promoted (run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>)" >> $GITHUB_OUTPUT
          else
            echo "❌ Deployment to Testnet failed."
            echo "Contracts: ${{ needs.deploy-contracts.result }}"
            echo "App: ${{ needs.deploy-app.result }}"
            echo "Canary verify: ${{ needs.verify-canary.result }}"
            echo "Promote: ${{ needs.promote-canary.result }}"
            echo "message=❌ Traqora testnet deployment failed (run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>)" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"${{ steps.status.outputs.message }}\"}" || true
          else
            echo "SLACK_WEBHOOK_URL not configured - skipping notification"
          fi

      - name: Fail job if deployment failed
        if: needs.deploy-contracts.result != 'success' || needs.deploy-app.result != 'success' || needs.promote-canary.result != 'success'
        run: exit 1
