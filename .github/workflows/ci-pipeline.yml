name: CI Pipeline

# Triggers — runs on PRs and pushes to main only.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "1.94.1"
  SOROBAN_CLI_VERSION: "26.1.0"
  # Shared Cargo cache paths — referenced in every Rust job.
  CARGO_CACHE_PATHS: |
    ~/.cargo/bin/
    ~/.cargo/registry/index/
    ~/.cargo/registry/cache/
    ~/.cargo/git/db/
    contracts/target/

# ---------------------------------------------------------------------------
# Cache strategy
# ──────────────
#  npm        : actions/setup-node handles ~/.npm internally when cache: npm
#               is set; cache-dependency-path uses **/package.json because
#               no root package-lock.json is committed to this repo.
#  cargo      : primary key  = OS + Cargo.lock hash
#               restore-keys = OS prefix   (partial hit on Cargo.lock change)
#  llvm-cov   : keyed on tool version so upgrades bust the cache correctly
#  apt        : keyed on a per-file bucket to avoid stale package lists
#  docker     : GHA layer cache per service, scoped by matrix value
#
# Parallelism changes vs. original
# ─────────────────────────────────
#  • security-snyk + security-gitleaks + security-sonarcloud no longer wait
#    for integration-backend; they fan out from quality checks in parallel.
#  • build-backend + build-client no longer block on security-gitleaks;
#    they start as soon as their respective test jobs pass.
#  • Docker builds use per-service GHA layer cache so unchanged layers are
#    never pushed or pulled over the wire again.
# ---------------------------------------------------------------------------

jobs:
  # ==========================================================================
  # STAGE 1 — Quality & Linting (parallel, no predecessors)
  # ==========================================================================

  quality-backend:
    name: Quality - Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck --workspace=packages/backend

      # Advisory for now: ~800 pre-existing eslint findings on main.
      - name: Lint
        run: npm run lint --workspace=packages/backend || true

  quality-client:
    name: Quality - Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint --workspace=packages/client || true

  quality-contracts:
    name: Quality - Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-pipeline.yml') }}-contracts
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libudev-dev

      - name: Format check
        working-directory: contracts
        run: cargo fmt -- --check

      - name: Clippy
        run: |
          cd contracts
          # integration-tests enables soroban-sdk "testutils", which cannot
          # be compiled for the wasm target; it is a native test harness,
          # never deployed, so it is excluded here.
          cargo clippy --locked --target wasm32-unknown-unknown --workspace --exclude integration-tests -- -D warnings

  # ==========================================================================
  # STAGE 2 — Unit Tests (parallel, each gated on its quality job)
  # ==========================================================================

  test-backend:
    name: Unit Tests - Backend
    runs-on: ubuntu-latest
    needs: [quality-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test --workspace=packages/backend

  test-client:
    name: Unit Tests - Client
    runs-on: ubuntu-latest
    needs: [quality-client]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test --workspace=packages/client

  test-contracts:
    name: Unit Tests - Contracts
    runs-on: ubuntu-latest
    needs: [quality-contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # cargo-llvm-cov is a large binary; cache it keyed on the Rust toolchain
      # version so it is only re-downloaded when the toolchain changes.
      - name: Restore cargo-llvm-cov binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-pipeline.yml') }}-contracts
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libudev-dev

      - name: Run tests
        working-directory: contracts
        run: cargo test --locked

      - name: Install cargo-llvm-cov (if not cached)
        run: cargo install cargo-llvm-cov --locked 2>/dev/null || true

      - name: Coverage report
        working-directory: contracts
        run: cargo llvm-cov --summary-only --fail-under-lines 90

  # ==========================================================================
  # STAGE 3 — Integration Tests (needs services, gated on test-backend)
  # ==========================================================================

  integration-backend:
    name: Integration Tests - Backend
    runs-on: ubuntu-latest
    needs: [test-backend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: traqora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run integration tests (Auth)
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://postgres:password@localhost:5432/traqora_test
          JWT_SECRET: test-secret
          STELLAR_NETWORK: testnet
        run: npm run test:integration --workspace=packages/backend -- tests/auth/

      - name: Run integration tests (Booking Flow)
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://postgres:password@localhost:5432/traqora_test
          JWT_SECRET: test-secret
          STELLAR_NETWORK: testnet
        run: npm run test:integration --workspace=packages/backend -- tests/booking-flow.integration.test.ts

      - name: Metrics smoke test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://postgres:password@localhost:5432/traqora_test
          JWT_SECRET: test-secret
          STELLAR_NETWORK: testnet
        run: npm test --workspace=packages/backend -- --runInBand tests/integration/metrics.smoke.integration.test.ts

      - name: Coverage report (Backend)
        if: always()
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
        run: |
          npm test --workspace=packages/backend -- \
            --coverage \
            --coverageReporters=lcov \
            --coverageReporters=text-summary \
            --runInBand \
            --forceExit \
            tests/booking-flow.integration.test.ts 2>/dev/null || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: packages/backend/coverage/
          retention-days: 14

  # ==========================================================================
  # STAGE 4 — Security, E2E & A11y (all fan out in parallel)
  # ==========================================================================
  # These jobs no longer wait for integration-backend. They start as soon as
  # the quality tier completes, running in parallel with stages 2 and 3.
  # None of them produce artefacts that test/build jobs consume, so there is
  # no correctness risk in starting them early.

  e2e-booking:
    name: E2E Tests - Booking Flow
    runs-on: ubuntu-latest
    needs: [test-client]
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # Playwright browser binaries are cached by the built-in store path.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/client/**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E booking tests
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --project=e2e --reporter=list
        continue-on-error: true

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-booking-results
          path: packages/client/test-results/
          retention-days: 14

  # Security jobs fan out from quality checks, not from integration-backend,
  # so they run in parallel with tests and integration rather than after them.
  security-snyk:
    name: Security - Snyk
    runs-on: ubuntu-latest
    needs: [quality-backend, quality-client]
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
        continue-on-error: true

  security-gitleaks:
    name: Security - Gitleaks
    runs-on: ubuntu-latest
    needs: [quality-backend, quality-client, quality-contracts]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not just HEAD
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks Scan (repo config)
        # Uses the committed .gitleaks.toml so allowlists/baselines are
        # versioned and reviewed like code. Output is always redacted.
        # To update the baseline after a false positive, see
        # "Updating the gitleaks baseline" in docs/security/secrets-management.md
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  security-sonarcloud:
    name: Security - SonarCloud
    runs-on: ubuntu-latest
    needs: [quality-backend, quality-client]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  accessibility:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [test-client]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/client/**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: packages/client
        run: npx playwright install --with-deps chromium

      - name: Run axe a11y suite
        working-directory: packages/client
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test tests/a11y --reporter=list
        continue-on-error: true

  # ==========================================================================
  # STAGE 5 — Builds (parallel, gated only on their own test job)
  # ==========================================================================
  # build-backend/client no longer wait for security-gitleaks — builds start
  # as soon as unit tests pass, in parallel with security scans.

  build-contracts:
    name: Build - Contracts
    runs-on: ubuntu-latest
    needs: [test-contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci-pipeline.yml') }}-contracts
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libudev-dev

      - name: Install Soroban CLI
        run: cargo install --locked --version ${{ env.SOROBAN_CLI_VERSION }} soroban-cli

      - name: Build contracts
        working-directory: contracts
        run: cargo build --locked --target wasm32-unknown-unknown --release

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: traqora-contracts-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  build-backend:
    name: Build - Backend
    runs-on: ubuntu-latest
    needs: [integration-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build backend
        run: npm run build --workspace=packages/backend

  build-client:
    name: Build - Client
    runs-on: ubuntu-latest
    needs: [test-client]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build client
        run: npm run build --workspace=packages/client

  # ==========================================================================
  # STAGE 6 — Docker Security Scan (parallel matrix, GHA layer cache)
  # ==========================================================================

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: packages/backend
          - image: client
            context: packages/client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: false
          load: true
          tags: traqora-${{ matrix.image }}:scan
          # Per-service GHA layer cache: backend and client never share entries
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install Trivy (retry)
        run: |
          for i in 1 2 3; do
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.65.0 && break
            echo "trivy install attempt $i failed, retrying..."
            sleep 10
          done
          trivy --version

      - name: Scan with Trivy (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          skip-setup-trivy: true
          image-ref: traqora-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          format: table

      - name: Upload Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          skip-setup-trivy: true
          image-ref: traqora-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}-sarif
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 14
