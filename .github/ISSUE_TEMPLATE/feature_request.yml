name: Feature Request
description: Propose a new Traqora capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature you'd like to see added to Traqora.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the platform does this feature touch?
      options:
        - client
        - backend
        - contracts
        - infrastructure
        - docs
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph summary of the capability.
      placeholder: Describe the feature …
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? Link to related issues if applicable.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Bullet list of conditions that must be true for this issue to be closed.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Explicitly list things this issue does NOT cover.
      placeholder: |
        - …
        - …
