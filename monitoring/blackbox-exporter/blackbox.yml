# -------------------------------------------------------------------
# Blackbox Exporter Configuration  (Issue #597)
# -------------------------------------------------------------------
# HTTP probe modules for external uptime checks.
# Prometheus scrapes blackbox-exporter with probe parameters.
# -------------------------------------------------------------------

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4

  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: POST
      headers:
        Content-Type: application/json

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
