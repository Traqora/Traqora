# -------------------------------------------------------------------
# AlertManager Configuration  (Issues #597, #598)
# -------------------------------------------------------------------
# Routes alerts to Slack and PagerDuty based on severity.
# Includes uptime-probe routing for external health checks.
# -------------------------------------------------------------------

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.traqora.io:587"
  smtp_from: "alertmanager@traqora.io"
  smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "slack-general"
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Uptime probe alerts → PagerDuty (critical) and Slack
    - matchers:
        - alertname=~"UptimeProbe.*"
      receiver: "pagerduty-oncall"
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 5m

    # Critical alerts → PagerDuty immediately
    - matchers:
        - severity=critical
      receiver: "pagerduty-oncall"
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 1h

    # Warning alerts → Slack channel
    - matchers:
        - severity=warning
      receiver: "slack-alerts"
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 4h

    # Informational → Slack channel only
    - matchers:
        - severity=info
      receiver: "slack-alerts"
      group_wait: 5m
      group_interval: 15m
      repeat_interval: 12h

receivers:
  - name: "slack-general"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#traqora-alerts"
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        send_resolved: true

  - name: "slack-alerts"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#traqora-alerts"
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        send_resolved: true

  - name: "pagerduty-oncall"
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'

inhibit_rules:
  # Don't alert on warnings if critical is already firing
  - source_matchers:
      - severity=critical
    target_matchers:
      - severity=warning
    equal: ["alertname", "service"]
