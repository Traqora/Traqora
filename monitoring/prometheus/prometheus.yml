global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'traqora-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/slo-rules.yml'
  - '/etc/prometheus/booking-success-rules.yml'
  - '/etc/prometheus/error-rate-rules.yml'
  - '/etc/prometheus/uptime-probe-rules.yml'

# Scrape configurations
scrape_configs:
  # Traqora Backend
  - job_name: 'traqora-backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

  # Blackbox Exporter (external uptime probes)
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets:
          - 'blackbox-exporter:9115'

  # External uptime probes via Blackbox Exporter
  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - 'https://api.traqora.io/health'
          - 'https://api.traqora.io/api/v1/health'
        labels:
          service: traqora-api
          environment: production
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
      - source_labels: [__param_target]
        target_label: instance
