server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: traqora-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: traqora-backend
          __path__: /var/log/traqora/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
            component: component
            correlationId: correlationId
            requestId: requestId
            userId: userId
            adminId: adminId
            sessionId: sessionId
            durationMs: durationMs
            error: error
            statusCode: statusCode
            method: method
            path: path
      - labels:
          level:
          service:
          component:
          statusCode:
          method:
      - timestamp:
          source: timestamp
          format: RFC3339
      - metrics:
          loki_log_entries_total:
            type: Counter
            description: "Total log entries by level and component"
            prefix: traqora_
            max_idle_duration: 24h
            match:
              - level: error
              - level: warn
            config:
              action: inc
              labels:
                - level
                - component

  - job_name: traqora-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: traqora-audit
          __path__: /var/log/traqora/audit*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            action: action
            resource: resource
            resourceId: resourceId
            actorType: actorType
            actorId: actorId
            component: component
            correlationId: correlationId
            ipAddress: ipAddress
            logId: logId
      - labels:
          level:
          action:
          resource:
          actorType:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: traqora-client
    static_configs:
      - targets:
          - localhost
        labels:
          job: traqora-client
          __path__: /var/log/traqora/client*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            component: component
            action: action
            resource: resource
      - labels:
          level:
          component:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log
